version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: handmade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: handmade_store
      MYSQL_USER: handmade
      MYSQL_PASSWORD: handmade123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handmade-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/handmade_store
      SPRING_DATASOURCE_USERNAME: handmade
      SPRING_DATASOURCE_PASSWORD: handmade123
      JWT_SECRET: handmade-store-secret-key-for-jwt-token-generation-2024
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: handmade-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
